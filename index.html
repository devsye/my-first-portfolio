
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Abolfazl's personal developer portfolio">
  <title>Abolfazl | Developer Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #f3f6ff;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 720px;
      padding: 36px;
      border: 1px solid #26344f;
      border-radius: 20px;
      background: #111a2e;
    }

    .tag {
      color: #63d9c5;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(32px, 7vw, 52px);
      margin-bottom: 12px;
    }

    p {
      color: #b9c5d9;
      line-height: 1.8;
    }

    .project {
      margin-top: 28px;
      padding: 20px;
      background: #19243b;
      border-radius: 12px;
    }

    a {
      color: #63d9c5;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 30px;
      font-size: 13px;
      color: #91a0b9;
    }
  </style>
</head>
<body>
  <main>
    <div class="tag">Personal Portfolio</div>
    <h1>Hi, I'm Abolfazl.</h1>

    <p>
      I'm exploring software development and learning
      to build useful digital products.
    </p>

    <section class="project">
      <h2>My First Project</h2>
      <p>
        This is my first portfolio website, built
        with HTML and CSS.
      </p>
      <a href="https://github.com/devsye">
        Visit my GitHub profile →
      </a>
    </section>

    <footer>
      Learning, building, and improving.
    </footer>
  </main>
</body>
</html>
